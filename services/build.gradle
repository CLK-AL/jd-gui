plugins {
    id 'java-library'
    id 'antlr'
    id 'org.jetbrains.kotlin.jvm'
}

version = parent.version

dependencies {
    // RSyntaxTextArea for syntax highlighting
    implementation 'com.fifesoft:rsyntaxtextarea:3.4.0'

    // ASM 9.6 for Java 21 bytecode support
    implementation "org.ow2.asm:asm:${rootProject.asmVersion}"
    implementation "org.ow2.asm:asm-util:${rootProject.asmVersion}"

    // JD-Core decompiler
    implementation 'org.jd:jd-core:' + parent.jdCoreVersion

    // ANTLR 4.13.1
    antlr "org.antlr:antlr4:${rootProject.antlrVersion}"
    implementation "org.antlr:antlr4-runtime:${rootProject.antlrVersion}"

    // Project dependencies
    api project(':api')

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ANTLR Configuration - Grammars organized by language/version
// Directory structure: antlr/{language}/{version}/
// Examples:
//   - antlr/java/8, antlr/java/21, antlr/java/latest
//
// Configure via gradle properties:
//   -PantlrLanguage=java -PantlrVersion=latest
ext.antlr4 = [
    language      : findProperty('antlrLanguage') ?: 'java',
    version       : findProperty('antlrVersion') ?: 'latest',
    antlrSource   : 'src/main/antlr',
    destinationDir: 'src-generated/antlr/java',
    grammarPackage: 'al.clk.gui.util.parser.antlr'
]
// Resolve grammar source directory based on language and version
ext.antlr4.grammarDir = "${antlr4.antlrSource}/${antlr4.language}/${antlr4.version}"

// Configure ANTLR task
generateGrammarSource {
    maxHeapSize = '512m'
    arguments += ['-visitor', '-listener', '-long-messages']
    outputDirectory = file("${antlr4.destinationDir}/${antlr4.grammarPackage.replace('.', '/')}")
}

task antlr4OutputDir {
    doLast {
        mkdir antlr4.destinationDir
    }
}

task antlr4GenerateGrammarSource(dependsOn: antlr4OutputDir, type: JavaExec) {
    description = 'Generates Java sources from ANTLR4 grammars.'

    inputs.dir file(antlr4.grammarDir)
    outputs.dir file(antlr4.destinationDir)

    def grammars = fileTree(antlr4.grammarDir).include('**/*.g4')
    def pkg = antlr4.grammarPackage.replace(".", "/")

    mainClass = 'org.antlr.v4.Tool'
    classpath = configurations.antlr
    args = ['-o', "${antlr4.destinationDir}/${pkg}", '-package', antlr4.grammarPackage, '-visitor', '-listener', grammars.files].flatten()
}

compileJava {
    dependsOn antlr4GenerateGrammarSource
    source antlr4.destinationDir
}

clean {
    delete 'src-generated'
}

idea.module {
    sourceDirs += file(antlr4.destinationDir)
    generatedSourceDirs += file(antlr4.destinationDir)
}
ideaModule.dependsOn antlr4GenerateGrammarSource

eclipse.classpath.file.withXml { xml ->
    def node = xml.asNode()
    node.appendNode('classpathentry', [kind: 'src', path: antlr4.destinationDir])
}
eclipseClasspath.dependsOn antlr4GenerateGrammarSource

// Java 21 toolchain configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Kotlin configuration
kotlin {
    jvmToolchain(21)
}

// Ensure Kotlin compiles before Java (for mixed sources)
compileKotlin {
    dependsOn antlr4GenerateGrammarSource
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs += ['-Xjsr305=strict']
    }
}

// Test configuration
test {
    useJUnitPlatform()
}
