name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  GRAALVM_VERSION: '21'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'

jobs:
  # Build and Test with standard JDK
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon --warning-mode all
        shell: bash

      - name: Run tests
        run: ./gradlew test --no-daemon
        shell: bash

      - name: Upload build artifacts
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gui-jar
          path: build/libs/*.jar
          retention-days: 7

  # GraalVM Native Image Build
  native-image:
    name: GraalVM Native Image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-name: gui-linux
            artifact-ext: ''
          - os: windows-latest
            artifact-name: gui-windows
            artifact-ext: '.exe'
          - os: macos-latest
            artifact-name: gui-macos
            artifact-ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew jar --no-daemon
        shell: bash

      - name: Build Native Image (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          native-image \
            --no-fallback \
            --enable-preview \
            -H:+ReportExceptionStackTraces \
            -H:ConfigurationFileDirectories=src/graalvm/native-image \
            -jar build/libs/gui-*.jar \
            -o build/native/${{ matrix.artifact-name }}
        continue-on-error: true

      - name: Build Native Image (Windows)
        if: runner.os == 'Windows'
        run: |
          native-image `
            --no-fallback `
            --enable-preview `
            -H:+ReportExceptionStackTraces `
            -H:ConfigurationFileDirectories=src/graalvm/native-image `
            -jar (Get-ChildItem build/libs/gui-*.jar).FullName `
            -o build/native/${{ matrix.artifact-name }}
        shell: pwsh
        continue-on-error: true

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/native/${{ matrix.artifact-name }}${{ matrix.artifact-ext }}
          retention-days: 7
          if-no-files-found: warn

  # Build distribution packages
  package:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all distributions
        run: |
          ./gradlew jar proguard --no-daemon
          # Build DEB and RPM packages
          ./gradlew buildDeb buildRpm --no-daemon || true

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: gui-deb
          path: build/distributions/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: gui-rpm
          path: build/distributions/*.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload minified JAR
        uses: actions/upload-artifact@v4
        with:
          name: gui-min-jar
          path: build/libs/*-min.jar
          retention-days: 7
          if-no-files-found: warn

  # Code quality checks
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate ANTLR sources
        run: ./gradlew :api:antlr4GenerateGrammarSource :services:antlr4GenerateGrammarSource --no-daemon

      - name: Check code style
        run: ./gradlew check --no-daemon || true

  # Release job (only on tags)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.jar
            artifacts/**/*.deb
            artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
