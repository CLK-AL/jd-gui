# GraalVM Native Image configuration for JD-GUI
# Java 21 with GraalVM support

Args = \
  --no-fallback \
  --enable-preview \
  --initialize-at-build-time=org.slf4j \
  --initialize-at-run-time=sun.awt,sun.java2d,java.awt,javax.swing \
  -H:+ReportExceptionStackTraces \
  -H:+AddAllCharsets \
  -H:EnableURLProtocols=http,https,jar,file \
  -H:IncludeResources=.*\\.png$ \
  -H:IncludeResources=.*\\.gif$ \
  -H:IncludeResources=.*\\.properties$ \
  -H:IncludeResources=META-INF/services/.* \
  --enable-http \
  --enable-https \
  -Djava.awt.headless=false

# For GUI applications on Linux
# Args.linux = -H:+StaticExecutableWithDynamicLibC
