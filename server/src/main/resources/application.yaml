ktor:
  application:
    modules:
      - al.clk.gui.server.ApplicationKt.module
  deployment:
    port: 8080
    host: 0.0.0.0

# Keycloak OIDC Configuration
keycloak:
  realm: gui
  auth-server-url: ${KEYCLOAK_URL:-http://localhost:8180}
  client-id: gui-server
  client-secret: ${KEYCLOAK_CLIENT_SECRET:-}
  ssl-required: external
  public-client: false
  bearer-only: true
  jwks-url: ${KEYCLOAK_JWKS_URL:-http://localhost:8180/realms/gui/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/gui}

# WebDAV Storage Configuration
storage:
  base-path: ${STORAGE_PATH:-./data}
  system-folder: system
  users-folder: users
  max-file-size: 104857600  # 100MB
  allowed-extensions:
    - .jar
    - .class
    - .java
    - .kt
    - .xml
    - .json
    - .properties

# Yjs Sync Configuration
sync:
  enabled: true
  debounce-ms: 500
  broadcast-changes: true

# Openfire XMPP Configuration (Organization vCard sync)
openfire:
  enabled: ${OPENFIRE_ENABLED:-false}
  host: ${OPENFIRE_HOST:-localhost}
  port: ${OPENFIRE_PORT:-5222}
  domain: ${OPENFIRE_DOMAIN:-localhost}
  admin-username: ${OPENFIRE_ADMIN_USER:-admin}
  admin-password: ${OPENFIRE_ADMIN_PASSWORD:-}
  security-mode: ${OPENFIRE_SECURITY_MODE:-disabled}
  resource-name: gui-server
  connection-timeout: 30000
  enable-roster: true
  enable-pubsub: true

# Matrix Configuration (User social features)
matrix:
  enabled: ${MATRIX_ENABLED:-false}
  homeserver-url: ${MATRIX_HOMESERVER_URL:-http://localhost:8008}
  server-name: ${MATRIX_SERVER_NAME:-localhost}
  admin-username: ${MATRIX_ADMIN_USER:-admin}
  admin-access-token: ${MATRIX_ADMIN_TOKEN:-}
  enable-presence: true
  enable-rooms: true
  enable-dm: true
  org-room-prefix: gui-org
  sync-timeout-ms: 30000

# Bedework CalDAV/CardDAV Configuration (Calendar & Contacts)
bedework:
  enabled: ${BEDEWORK_ENABLED:-false}
  base-url: ${BEDEWORK_URL:-http://localhost:8080/bedework}
  caldav-path: /ucaldav
  carddav-path: /ucarddav
  admin-username: ${BEDEWORK_ADMIN_USER:-admin}
  admin-password: ${BEDEWORK_ADMIN_PASSWORD:-}
  default-calendar: calendar
  default-addressbook: contacts
  sync-interval-ms: 60000
  enable-calendar-sync: true
  enable-contacts-sync: true

# Logging
logging:
  level:
    root: INFO
    al.clk.gui: DEBUG
    io.ktor: INFO
